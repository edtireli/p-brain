name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (core + dev extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Verify CLI entry point
        run: pbrain --help

      - name: Run test suite
        run: pytest -q

      - name: Weights-free pipeline smoke (synthetic phantom, no patient data)
        run: python -m pbrain.demo --clean
