[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p-brain"
description = "A modular, cross-platform framework for automated DCE-MRI and diffusion MRI research."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Edis Devin Tireli", email = "aizibuzi@gmail.com" },
]
keywords = ["MRI", "DCE-MRI", "diffusion", "pharmacokinetics", "neuroimaging", "Patlak", "Tikhonov"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]
# Core runtime is deliberately light; everything heavier is an opt-in extra.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "nibabel>=5.0",
    "rich>=13.7",
    "tomli>=2.0; python_version < '3.11'",   # tomllib is 3.11+ stdlib
]
dynamic = ["version"]

[project.optional-dependencies]
# CNN arterial-input-function (default `cnn_sss_shifted`); weights on Zenodo.
cnn = ["tensorflow>=2.13"]
# Apple-Silicon GPU for the TensorFlow stages (CNN AIF + SynthSeg). Apple's Metal
# plugin (`tensorflow-metal`) only loads on TF <= 2.16, so this pins the matched
# pair — and only on arm64 macOS. On any other platform it installs nothing (Linux
# GPU users use `cnn` with a CUDA build of TensorFlow). Opt in: `pip install p-brain[metal]`.
metal = [
    "tensorflow>=2.13,<2.17; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "tensorflow-metal>=1.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Diffusion track (DTI/DKI/CSD/…): dipy provides the models + tractography.
diffusion = ["dipy>=1.7", "fury>=0.10"]
# NODDI microstructure model (optional diffusion plug-in) via the AMICO framework.
noddi = ["dmri-amico>=2.0"]
# DICOM input. pydicom reads headers; the actual 4-D reconstruction uses the
# external `dcm2niix` binary (install via conda-forge / apt / brew — not pip).
dicom = ["pydicom>=2.4"]
# YAML config files (TOML works with no extra dependency on Python >=3.11).
yaml = ["pyyaml>=6.0"]
# GPU device probing for --device mps/cuda.
torch = ["torch>=2.0"]
# Test + coverage tooling.
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
# Rendered API reference (mkdocs + mkdocstrings autodoc). Build: `mkdocs build`.
docs = ["mkdocs>=1.5", "mkdocstrings[python]>=0.24", "mkdocs-material>=9.0"]
# Everything (convenience meta-extra for a full local install).
all = [
    "tensorflow>=2.13",
    "dipy>=1.7",
    "dmri-amico>=2.0",
    "pydicom>=2.4",
    "pyyaml>=6.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/edtireli/p-brain"
Repository = "https://github.com/edtireli/p-brain"
Issues = "https://github.com/edtireli/p-brain/issues"

[project.scripts]
pbrain = "pbrain.cli.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "pbrain.__version__" }

[tool.setuptools.packages.find]
include = ["pbrain*"]
exclude = ["tests*", "validation*", "docs*", "scripts*", "demo*", "AI*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
